name: Build NVD AirCard IPA

# Build IPA chưa ký của bản cá nhân hoá NVD AirCard (fork từ Mak5er/AirCard-iOS).
# Chỉ build, không ký, không publish release.
# Image/Xcode theo đúng cấu hình đã chạy thành công cho LiveContainer
# (runs-on xcode-27 + setup-xcode 27.2).

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.2'
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build IPA (unsigned)
        run: ./build-ipa.sh Release
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NVD-AirCard-ipa
          path: build/NVD-AirCard.ipa
